<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurostat probe 2</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6; color: #1a1a1a; background: #fdfdfb;
    max-width: 820px; margin: 0 auto; padding: 40px 24px;
  }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.05rem; margin-top: 34px; }
  pre {
    background: #f4f7f5; border: 1px solid #d8e2dc; border-radius: 8px;
    padding: 14px; overflow-x: auto; font-size: 0.78rem; white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>Eurostat probe 2</h1>
<p>Listing dimension codes so the right filters can be chosen. Diagnostic file only.</p>

<h2>cei_wm020 — recycling rate of packaging waste</h2>
<pre id="a">Loading…</pre>

<h2>cei_pc050 — plastic packaging waste per capita</h2>
<pre id="b">Loading…</pre>

<script>
var BASE = "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/";

function probe(code, targetId) {
  var url = BASE + code + "?format=JSON&lang=EN&geo=EU27_2020";
  fetch(url)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (d) {
      var out = [];
      out.push("label: " + (d.label || "-"));
      out.push("updated: " + (d.updated || "-"));
      out.push("");

      var ids = d.id || [];
      var sizes = d.size || [];

      for (var i = 0; i < ids.length; i++) {
        var dim = ids[i];
        out.push(dim + "  (size " + sizes[i] + ")");
        if (dim === "time") {
          var t = Object.keys(d.dimension.time.category.index);
          out.push("   range: " + t[0] + " to " + t[t.length - 1]);
        } else if (sizes[i] > 1) {
          var cat = d.dimension[dim].category;
          var codes = Object.keys(cat.index);
          for (var j = 0; j < codes.length; j++) {
            out.push("   " + codes[j] + "  =  " + (cat.label ? cat.label[codes[j]] : ""));
          }
        } else {
          var c2 = d.dimension[dim].category;
          var only = Object.keys(c2.index)[0];
          out.push("   " + only + "  =  " + (c2.label ? c2.label[only] : ""));
        }
        out.push("");
      }
      document.getElementById(targetId).textContent = out.join("\n");
    })
    .catch(function (e) {
      document.getElementById(targetId).textContent = "FAILED: " + e.message;
    });
}

probe("cei_wm020", "a");
probe("cei_pc050", "b");
</script>

</body>
</html>
